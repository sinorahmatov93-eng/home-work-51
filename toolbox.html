<!DOCTYPE html>
<html lang="ru" style="box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мини-инструменты</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans">
<header class="sticky top-0 z-10 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
  <div class="max-w-4xl mx-auto px-4 py-3">
    <a href="#home" class="font-bold text-lg text-indigo-600 dark:text-indigo-400">🧰 Мини-инструменты</a>
    <nav id="nav" class="flex gap-2 overflow-x-auto mt-2 pb-1 text-sm"></nav>
  </div>
</header>
<main id="app" class="max-w-4xl mx-auto px-4 py-6"></main>
<footer class="text-center text-xs text-slate-500 dark:text-slate-400 pb-8">10 страниц · Tailwind + JS · без style.css</footer>

<script>
const inp = 'w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500';
const btn = 'rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 font-medium transition';
const btn2 = 'rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 px-4 py-2 font-medium transition';
const card = 'rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-5 shadow-sm';
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const copy = async t => { try { await navigator.clipboard.writeText(t); return true; } catch (e) { return false; } };
let timerId = null;

const routes = {
  home: { t: 'Главная', i: '🏠',
    html: () => `<section class="rounded-3xl bg-gradient-to-br from-indigo-600 to-purple-600 text-white p-8 md:p-14 mb-10"><h1 class="text-3xl md:text-5xl font-bold mb-4">Полезные инструменты под рукой</h1><p class="text-lg opacity-90 max-w-2xl">Девять быстрых утилит для повседневных задач: считать, конвертировать, планировать и записывать. Всё работает прямо в браузере, без регистрации и рекламы.</p><a href="#calc" class="inline-block mt-6 bg-white text-indigo-700 rounded-lg px-5 py-3 font-semibold">Начать с калькулятора</a></section>
      <h2 class="text-2xl font-bold mb-4">Все инструменты</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      ${Object.entries(routes).filter(([k]) => k !== 'home').map(([k, r]) => `<a href="#${k}" class="${card} hover:ring-2 hover:ring-indigo-500 transition block"><div class="text-3xl mb-2">${r.i}</div><div class="font-semibold">${r.t}</div><div class="text-sm text-slate-500 dark:text-slate-400">${r.d}</div></a>`).join('')}
      </div>${longHome()}` },

  calc: { t: 'Калькулятор', i: '🧮', d: 'Быстрые вычисления',
    html: () => `<h2 class="text-2xl font-bold mb-4">Калькулятор</h2><div class="${card} max-w-sm">
      <input id="cd" class="${inp} text-right text-2xl mb-3" readonly value="0">
      <div id="ck" class="grid grid-cols-4 gap-2">${['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','⌫','='].map(k => `<button data-k="${k}" class="${/[0-9.]/.test(k) ? btn2 : btn}">${k}</button>`).join('')}</div></div>`,
    init() {
      let e = '';
      $('#ck').onclick = ev => {
        const k = ev.target.dataset.k; if (!k) return;
        if (k === 'C') e = ''; else if (k === '⌫') e = e.slice(0, -1);
        else if (k === '=') { try { if (/^[0-9+\-*/().\s]+$/.test(e)) e = String(+Function('return (' + e + ')')().toFixed(10)); } catch (x) { e = 'Ошибка'; } }
        else { if (e === 'Ошибка') e = ''; e += k; }
        $('#cd').value = e || '0';
      };
    } },

  convert: { t: 'Конвертер', i: '📏', d: 'Длина, масса, температура',
    html: () => `<h2 class="text-2xl font-bold mb-4">Конвертер величин</h2><div class="${card} max-w-md space-y-3">
      <select id="vt" class="${inp}"><option value="len">Длина</option><option value="mass">Масса</option><option value="temp">Температура</option></select>
      <input id="vv" type="number" value="1" class="${inp}">
      <div class="grid grid-cols-2 gap-2"><select id="vf" class="${inp}"></select><select id="vo" class="${inp}"></select></div>
      <div id="vr" class="text-2xl font-bold text-indigo-600 dark:text-indigo-400"></div></div>`,
    init() {
      const U = { len: { 'м': 1, 'км': 1000, 'см': 0.01, 'миля': 1609.344, 'фут': 0.3048 }, mass: { 'кг': 1, 'г': 0.001, 'т': 1000, 'фунт': 0.45359237, 'унция': 0.0283495 }, temp: { '°C': 1, '°F': 1, 'K': 1 } };
      const fill = () => { const o = Object.keys(U[$('#vt').value]).map(u => `<option>${u}</option>`).join(''); $('#vf').innerHTML = o; $('#vo').innerHTML = o; $('#vo').selectedIndex = 1; calc(); };
      const calc = () => {
        const t = $('#vt').value, v = parseFloat($('#vv').value), f = $('#vf').value, o = $('#vo').value; if (isNaN(v)) { $('#vr').textContent = '—'; return; }
        let r;
        if (t === 'temp') { const c = f === '°C' ? v : f === '°F' ? (v - 32) * 5 / 9 : v - 273.15; r = o === '°C' ? c : o === '°F' ? c * 9 / 5 + 32 : c + 273.15; }
        else r = v * U[t][f] / U[t][o];
        $('#vr').textContent = +r.toFixed(6) + ' ' + o;
      };
      $('#vt').onchange = fill; ['#vv', '#vf', '#vo'].forEach(s => $(s).oninput = calc); fill();
    } },

  timer: { t: 'Помодоро', i: '⏱️', d: 'Таймер для фокуса',
    html: () => `<h2 class="text-2xl font-bold mb-4">Таймер Помодоро</h2><div class="${card} max-w-sm text-center">
      <div class="flex justify-center gap-2 mb-4"><button data-m="25" class="${btn2}">Работа 25</button><button data-m="5" class="${btn2}">Отдых 5</button><button data-m="15" class="${btn2}">Пауза 15</button></div>
      <div id="td" class="text-6xl font-bold tabular-nums my-6">25:00</div>
      <div class="flex justify-center gap-2"><button id="ts" class="${btn}">Старт</button><button id="tr" class="${btn2}">Сброс</button></div></div>`,
    init() {
      let total = 1500, left = total;
      const show = () => { $('#td').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); document.title = $('#td').textContent + ' · Мини-инструменты'; };
      const stop = () => { clearInterval(timerId); timerId = null; $('#ts').textContent = 'Старт'; };
      $('#ts').onclick = () => {
        if (timerId) { stop(); return; }
        $('#ts').textContent = 'Пауза';
        timerId = setInterval(() => { left--; show(); if (left <= 0) { stop(); $('#td').textContent = 'Готово! 🎉'; } }, 1000);
      };
      $('#tr').onclick = () => { stop(); left = total; show(); };
      document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { stop(); total = left = +b.dataset.m * 60; show(); });
    } },

  notes: { t: 'Заметки', i: '📝', d: 'Автосохранение в браузере',
    html: () => `<h2 class="text-2xl font-bold mb-4">Заметки</h2><div class="${card}"><textarea id="nt" rows="12" class="${inp}" placeholder="Пишите здесь — текст сохраняется автоматически"></textarea><div id="ns" class="text-sm text-slate-500 mt-2"></div></div>`,
    init() {
      $('#nt').value = store.get('notes', '');
      $('#nt').oninput = e => { store.set('notes', e.target.value); $('#ns').textContent = 'Сохранено ✓'; };
    } },

  todo: { t: 'Задачи', i: '✅', d: 'Список дел',
    html: () => `<h2 class="text-2xl font-bold mb-4">Список задач</h2><div class="${card} max-w-lg">
      <div class="flex gap-2 mb-4"><input id="ti" class="${inp}" placeholder="Новая задача"><button id="ta" class="${btn}">+</button></div>
      <ul id="tl" class="space-y-2"></ul><div id="tc" class="text-sm text-slate-500 mt-3"></div></div>`,
    init() {
      let items = store.get('todos', []);
      const draw = () => {
        store.set('todos', items);
        $('#tl').innerHTML = items.map((x, i) => `<li class="flex items-center gap-3 p-2 rounded-lg bg-slate-100 dark:bg-slate-700"><input type="checkbox" data-c="${i}" ${x.d ? 'checked' : ''} class="w-5 h-5"><span class="flex-1 ${x.d ? 'line-through opacity-50' : ''}"></span><button data-x="${i}" class="text-red-500 px-2">✕</button></li>`).join('');
        [...$('#tl').children].forEach((li, i) => li.querySelector('span').textContent = items[i].t);
        $('#tc').textContent = `Выполнено: ${items.filter(x => x.d).length} из ${items.length}`;
      };
      const add = () => { const v = $('#ti').value.trim(); if (v) { items.push({ t: v, d: false }); $('#ti').value = ''; draw(); } };
      $('#ta').onclick = add; $('#ti').onkeydown = e => e.key === 'Enter' && add();
      $('#tl').onclick = e => {
        if (e.target.dataset.c !== undefined) items[e.target.dataset.c].d = e.target.checked;
        if (e.target.dataset.x !== undefined) items.splice(e.target.dataset.x, 1);
        draw();
      };
      draw();
    } },

  password: { t: 'Пароли', i: '🔐', d: 'Надёжный генератор',
    html: () => `<h2 class="text-2xl font-bold mb-4">Генератор паролей</h2><div class="${card} max-w-md space-y-3">
      <input id="pw" readonly class="${inp} font-mono text-lg">
      <label class="block text-sm">Длина: <b id="pl">16</b><input id="pr" type="range" min="6" max="48" value="16" class="w-full"></label>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <label><input type="checkbox" id="p1" checked> A–Z</label><label><input type="checkbox" id="p2" checked> a–z</label>
        <label><input type="checkbox" id="p3" checked> 0–9</label><label><input type="checkbox" id="p4" checked> !@#$</label></div>
      <div class="flex gap-2"><button id="pg" class="${btn}">Создать</button><button id="pc" class="${btn2}">Копировать</button></div></div>`,
    init() {
      const gen = () => {
        const sets = [['p1', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'], ['p2', 'abcdefghijklmnopqrstuvwxyz'], ['p3', '0123456789'], ['p4', '!@#$%^&*()-_=+?']];
        const pool = sets.filter(s => $('#' + s[0]).checked).map(s => s[1]).join('') || 'abcdefghijklmnopqrstuvwxyz';
        const n = +$('#pr').value, a = new Uint32Array(n); crypto.getRandomValues(a);
        $('#pw').value = [...a].map(x => pool[x % pool.length]).join('');
      };
      $('#pr').oninput = () => { $('#pl').textContent = $('#pr').value; gen(); };
      $('#pg').onclick = gen;
      $('#pc').onclick = async e => { if (await copy($('#pw').value)) { e.target.textContent = 'Скопировано ✓'; setTimeout(() => e.target.textContent = 'Копировать', 1500); } };
      gen();
    } },

  bmi: { t: 'ИМТ', i: '⚖️', d: 'Индекс массы тела',
    html: () => `<h2 class="text-2xl font-bold mb-4">Индекс массы тела</h2><div class="${card} max-w-sm space-y-3">
      <input id="bw" type="number" placeholder="Вес, кг" class="${inp}"><input id="bh" type="number" placeholder="Рост, см" class="${inp}">
      <button id="bb" class="${btn}">Рассчитать</button><div id="br" class="text-lg font-semibold"></div></div>`,
    init() {
      $('#bb').onclick = () => {
        const w = +$('#bw').value, h = +$('#bh').value / 100; if (!w || !h) { $('#br').textContent = 'Введите вес и рост'; return; }
        const b = w / (h * h), c = b < 18.5 ? 'недостаточный вес' : b < 25 ? 'норма' : b < 30 ? 'избыточный вес' : 'ожирение';
        $('#br').textContent = `ИМТ ${b.toFixed(1)} — ${c}`;
      };
    } },

  color: { t: 'Цвета', i: '🎨', d: 'HEX, RGB, HSL',
    html: () => `<h2 class="text-2xl font-bold mb-4">Выбор цвета</h2><div class="${card} max-w-sm space-y-3">
      <input id="cc" type="color" value="#6366f1" class="w-full h-24 rounded-lg cursor-pointer">
      <div id="co" class="space-y-2"></div></div>`,
    init() {
      const upd = () => {
        const hx = $('#cc').value, r = parseInt(hx.slice(1, 3), 16), g = parseInt(hx.slice(3, 5), 16), b = parseInt(hx.slice(5, 7), 16);
        const mx = Math.max(r, g, b) / 255, mn = Math.min(r, g, b) / 255, l = (mx + mn) / 2, d = mx - mn;
        let h = 0, s = 0;
        if (d) { s = d / (1 - Math.abs(2 * l - 1)); const R = r / 255, G = g / 255, B = b / 255; h = mx === R ? ((G - B) / d) % 6 : mx === G ? (B - R) / d + 2 : (R - G) / d + 4; h = (h * 60 + 360) % 360; }
        const v = [hx.toUpperCase(), `rgb(${r}, ${g}, ${b})`, `hsl(${Math.round(h)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`];
        $('#co').innerHTML = v.map(x => `<button class="${btn2} w-full font-mono text-left">${x}</button>`).join('');
        [...$('#co').children].forEach(b => b.onclick = async () => { if (await copy(b.textContent)) { const o = b.textContent; b.textContent = 'Скопировано ✓'; setTimeout(() => b.textContent = o, 1200); } });
      };
      $('#cc').oninput = upd; upd();
    } },

  counter: { t: 'Счётчик текста', i: '🔤', d: 'Слова, символы, время чтения',
    html: () => `<h2 class="text-2xl font-bold mb-4">Счётчик текста</h2><div class="${card}"><textarea id="xt" rows="8" class="${inp}" placeholder="Вставьте текст…"></textarea>
      <div id="xs" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4 text-center"></div></div>`,
    init() {
      const upd = () => {
        const t = $('#xt').value, w = t.trim() ? t.trim().split(/\s+/).length : 0;
        const st = [['Символов', t.length], ['Без пробелов', t.replace(/\s/g, '').length], ['Слов', w], ['Чтение, мин', Math.max(w ? 1 : 0, Math.ceil(w / 200))]];
        $('#xs').innerHTML = st.map(s => `<div class="rounded-lg bg-slate-100 dark:bg-slate-700 p-3"><div class="text-2xl font-bold">${s[1]}</div><div class="text-xs text-slate-500 dark:text-slate-300">${s[0]}</div></div>`).join('');
      };
      $('#xt').oninput = upd; upd();
    } }
};

const sec = (t, b) => `<section class="mt-12"><h2 class="text-2xl font-bold mb-4">${t}</h2>${b}</section>`;
const faqH = a => `<div class="space-y-2">${a.map(([q, x]) => `<details class="${card} !p-4"><summary class="cursor-pointer font-medium">${q}</summary><p class="mt-2 text-slate-600 dark:text-slate-300">${x}</p></details>`).join('')}</div>`;
const grid = (a, c) => `<div class="grid grid-cols-1 ${c} gap-4">${a.map(([h, x]) => `<div class="${card}"><div class="font-semibold mb-1">${h}</div><p class="text-sm text-slate-600 dark:text-slate-300">${x}</p></div>`).join('')}</div>`;

function longHome() {
  const stats = [['9', 'инструментов'], ['0', 'регистраций'], ['100%', 'работает в браузере'], ['24/7', 'всегда доступно']];
  return sec('Сайт в цифрах', `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">${stats.map(s => `<div class="${card}"><div class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">${s[0]}</div><div class="text-sm text-slate-500 dark:text-slate-400">${s[1]}</div></div>`).join('')}</div>`)
  + sec('Почему это удобно', grid([['Быстро', 'Страницы загружаются мгновенно: никаких лишних скриптов, баннеров и всплывающих окон.'], ['Приватно', 'Заметки, задачи и пароли остаются в вашем браузере и никуда не отправляются.'], ['Везде', 'Сайт одинаково удобен на телефоне, планшете и компьютере, а тёмная тема включается сама.']], 'md:grid-cols-3'))
  + sec('Как это работает', grid([['1. Выберите инструмент', 'Откройте нужную страницу в меню сверху или на главной.'], ['2. Введите данные', 'Результат считается сразу, без нажатия лишних кнопок.'], ['3. Используйте результат', 'Скопируйте пароль или цвет, сохраните заметку, отметьте задачу.']], 'md:grid-cols-3'))
  + sec('Частые вопросы', faqH([['Это бесплатно?', 'Да. Все инструменты доступны без оплаты и без регистрации.'], ['Где хранятся мои заметки?', 'В локальном хранилище вашего браузера. Если очистить данные сайта, заметки пропадут.'], ['Работает ли сайт без интернета?', 'После первой загрузки большинство функций работает, но для стилей нужен доступ к сети при открытии.'], ['Безопасны ли пароли из генератора?', 'Они создаются криптографическим генератором браузера и нигде не сохраняются.']]))
  + `<section class="mt-12 rounded-2xl bg-indigo-50 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 p-8 text-center"><h2 class="text-2xl font-bold mb-2">Готовы попробовать?</h2><p class="text-slate-600 dark:text-slate-300 mb-4">Начните с любого инструмента: это займёт меньше минуты.</p><a href="#todo" class="${btn} inline-block">Составить список задач</a></section>`;
}

const INFO = {
  calc: [['Введите выражение кнопками: скобки и четыре действия поддерживаются.', 'Нажмите «=», чтобы увидеть результат.', 'Кнопка ⌫ стирает последний символ, C очищает всё.'], ['Используйте скобки для порядка действий.', 'Для процентов умножайте на 0.15, 0.2 и так далее.', 'Деление на ноль даст бесконечность, проверяйте ввод.'], [['Какие операции доступны?', 'Сложение, вычитание, умножение, деление и скобки.'], ['Почему результат округлён?', 'Длинные дроби обрезаются до 10 знаков для читаемости.']]],
  convert: [['Выберите тип величины: длина, масса или температура.', 'Введите число и выберите исходную единицу.', 'Выберите целевую единицу: результат появится сразу.'], ['Для кулинарии удобно переводить граммы в унции.', 'Миля равна примерно 1.61 км.', 'Температура в Кельвинах: 0 °C = 273.15 K.'], [['Насколько точны расчёты?', 'Результат округляется до шести знаков после запятой.'], ['Можно ли добавить другие единицы?', 'Да, список легко расширить в коде страницы.']]],
  timer: [['Выберите режим: работа, отдых или длинная пауза.', 'Нажмите «Старт» и сосредоточьтесь на одной задаче.', 'Когда таймер закончится, сделайте перерыв.'], ['Убирайте телефон на время работы.', 'После четырёх циклов делайте длинную паузу.', 'Записывайте отвлекающие мысли в заметки.'], [['Что такое Помодоро?', 'Метод работы короткими интервалами по 25 минут с перерывами.'], ['Таймер работает в фоне?', 'Время отображается и во вкладке браузера, но лучше не закрывать страницу.']]],
  notes: [['Нажмите на поле и начните печатать.', 'Текст сохраняется автоматически при каждом изменении.', 'Вернитесь позже: заметка будет на месте.'], ['Разбивайте мысли на короткие абзацы.', 'Копируйте важное в другое место для резервной копии.', 'Не храните здесь пароли и секретные данные.'], [['Куда сохраняются заметки?', 'В локальное хранилище браузера на этом устройстве.'], ['Синхронизируются ли они между устройствами?', 'Нет, на каждом устройстве заметки свои.']]],
  todo: [['Введите задачу и нажмите «+» или Enter.', 'Отмечайте выполненное галочкой.', 'Удаляйте лишнее крестиком справа.'], ['Формулируйте задачи как конкретные действия.', 'Не добавляйте больше пяти дел на день.', 'Сначала делайте самое неприятное.'], [['Список пропадёт после закрытия?', 'Нет, он хранится в браузере до очистки данных сайта.'], ['Есть ли приоритеты?', 'Пока нет, но порядок добавления сохраняется.']]],

function extra(k) {
  const d = INFO[k]; if (!d) return '';
  const rel = Object.entries(routes).filter(([x]) => x !== 'home' && x !== k).slice(0, 4);
  return sec('Как пользоваться', `<ol class="space-y-2 list-decimal pl-6">${d[0].map(s => `<li>${s}</li>`).join('')}</ol>`)
    + sec('Полезные советы', `<ul class="space-y-2 list-disc pl-6">${d[1].map(s => `<li>${s}</li>`).join('')}</ul>`)
    + sec('Вопросы и ответы', faqH(d[2]))
    + sec('Другие инструменты', `<div class="flex flex-wrap gap-2">${rel.map(([x, r]) => `<a href="#${x}" class="${btn2}">${r.i} ${r.t}</a>`).join('')}</div>`);
}

$('#nav').innerHTML = Object.entries(routes).map(([k, r]) => `<a href="#${k}" data-n="${k}" class="whitespace-nowrap rounded-full px-3 py-1 bg-slate-100 dark:bg-slate-700">${r.i} ${r.t}</a>`).join('');

function render() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  const k = routes[location.hash.slice(1)] ? location.hash.slice(1) : 'home', r = routes[k];
  document.title = r.t + ' · Мини-инструменты';
  $('#app').innerHTML = r.html() + extra(k);
  if (r.init) r.init();
  document.querySelectorAll('#nav a').forEach(a => {
    const on = a.dataset.n === k;
    a.classList.toggle('bg-indigo-600', on); a.classList.toggle('text-white', on);
    a.classList.toggle('bg-slate-100', !on); a.classList.toggle('dark:bg-slate-700', !on);
  });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
